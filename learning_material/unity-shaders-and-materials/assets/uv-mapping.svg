<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="430" viewBox="0 0 1000 430"><rect width="1000" height="430" fill="#f2faf8"/><g font-family="Arial,sans-serif" fill="#142e30"><text x="55" y="35" font-size="23" font-weight="bold">1. A flat image</text><text x="590" y="35" font-size="23" font-weight="bold">2. A cube face uses UV addresses</text><g stroke="#193638" stroke-width="2"><rect x="90" y="65" width="120" height="120" fill="#da6656"/><rect x="210" y="65" width="120" height="120" fill="#51b4bb"/><rect x="90" y="185" width="120" height="120" fill="#d0b550"/><rect x="210" y="185" width="120" height="120" fill="#9b8dc4"/><path d="M590 95L650 65H890L830 95Z" fill="#d9e8e5"/><path d="M830 95L890 65V305L830 335Z" fill="#b7d4d0"/><rect x="590" y="95" width="120" height="120" fill="#da6656"/><rect x="710" y="95" width="120" height="120" fill="#51b4bb"/><rect x="590" y="215" width="120" height="120" fill="#d0b550"/><rect x="710" y="215" width="120" height="120" fill="#9b8dc4"/></g><g font-size="42" text-anchor="middle"><text x="150" y="148">A</text><text x="270" y="148">B</text><text x="150" y="268">C</text><text x="270" y="268">D</text><text x="650" y="178">A</text><text x="770" y="178">B</text><text x="650" y="298">C</text><text x="770" y="298">D</text></g><g font-size="17"><text x="80" y="330">0</text><text x="320" y="330">1</text><text x="48" y="78">1</text><text x="48" y="305">0</text><text x="160" y="355">U →</text><text x="17" y="185">V ↑</text></g><path d="M270 125 C410 38 510 48 770 155" fill="none" stroke="#006a70" stroke-width="4"/><circle cx="270" cy="125" r="7" fill="#132b30"/><circle cx="770" cy="155" r="7" fill="#132b30"/><text x="350" y="205" font-size="18">U = 0.75</text><text x="350" y="233" font-size="18">V = 0.75</text><text x="350" y="270" font-size="17">Sample region B</text><text x="55" y="402" font-size="18">The mesh supplies the addresses. The image supplies the colors. Other faces may orient the image differently.</text></g></svg>